faq:
  title: سوالات متداول
  description: پاسخ به سوالات رایج در مورد مهارت‌ها و فرآیند کاری من.
  categories:
    - title: مهارت‌ها و تخصص
      questions:
        - label: چه فناوری‌هایی رو بلدی؟
          content: "من در فرانت‌اند با React، Vue و Nuxt تخصص دارم. همچنین با Tailwind CSS، Bootstrap، GSAP و Motion برای طراحی و انیمیشن کار می‌کنم. در بک‌اند هم با Node.js، Express و NestJS آشنا هستم و تجربه کار با MySQL، PostgreSQL، REST API و GraphQL رو دارم."
        - label: با چه ابزارهایی کار می‌کنی؟
          content: "از VS Code به عنوان ویرایشگر کد، Vite برای build tool، Docker برای کانتینرسازی، و Git/GitHub برای مدیریت نسخه استفاده می‌کنم. همچنین با Figma برای طراحی رابط کاربری و Vercel/Supabase برای استقرار پروژه‌ها کار می‌کنم."
        - label: چقدر تجربه کار تیمی داری؟
          content: "در دلتاگروپ به عنوان توسعه‌دهنده فرانت مشغول به کار بودم و تجربه همکاری در تیم‌های توسعه رو دارم. با اصول CI/CD، کدنویسی تمیز و معماری مقیاس‌پذیر آشنا هستم."
    - title: فرآیند کاری
      questions:
        - label: فرآیند توسعه شما چگونه است؟
          content: "فرآیند من شامل درک نیازمندی‌ها، طراحی رابط کاربری، توسعه، تست و استقرار است. همیشه کد تمیز، قابل نگهداری و خوانا می‌نویسم و از اصول SOLID و الگوهای طراحی پیروی می‌کنم."
        - label: چطور کیفیت کد رو تضمین می‌کنی؟
          content: "از TypeScript برای تایپ قوی، ESLint برای لینتینگ، و تست‌های خودکار استفاده می‌کنم. همچنین code review انجام می‌دهم و مستندسازی مناسب رو رعایت می‌کنم."
        - label: چطور عملکرد برنامه رو بهینه می‌کنی؟
          content: "از lazy loading، code splitting، بهینه‌سازی تصاویر، caching و SSR/SSG در Nuxtو next استفاده می‌کنم. همچنین Lighthouse و Web Vitals رو برای اندازه‌گیری عملکرد رصد می‌کنم."
    - title: همکاری
      questions:
        - label: آیا پروژه‌های فریلنسری قبول می‌کنی؟
          content: "بله، پروژه‌های فریلنسری و همکاری‌های تیمی قبول می‌کنم. برای اطلاعات بیشتر از طریق تلگرام یا ایمیل تماس بگیرید."
        - label: چطور می‌تونم باهات تماس بگیرم؟
          content: "از طریق تلگرام، ایمیل یا لینکدین می‌تونید با من در ارتباط باشید. لینک‌ها در بخش فوتر سایت موجود است."