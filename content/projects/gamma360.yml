title: سایت خدماتی گاما 360
description: در این پروژه، رابط کاربری وب‌سایت گاما را با تمرکز بر حوزه تخصصی اتوماسیون صنعتی هوشمند طراحی کردم. چالش اصلی، ارائه مفاهیم فنی پیچیده در قالبی مدرن، ساده و کاربرپسند بود. با توجه به فعالیت بین‌المللی شرکت، سایت به صورت کاملاً دوزبانه (فارسی و انگلیسی) طراحی شد که نیازمند بهینه‌سازی دقیق برای هر دو زبان بود. نتیجه نهایی، یک پلتفرم با هویت بصری منسجم و طراحی واکنش‌ گرا (Responsive) است که تخصص و نوآوری شرکت را به شکلی حرفه‌ای به مخاطبان جهانی معرفی می‌کند.
